name: GitHub Actions Pipeline

on:
  push:
    branches:
      - main

jobs:
  checkout:
    name: Checkout Repository & Prepare Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write GCP credentials
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GCP_AUTH_KEY }}" > src/main/resources/credentials.json

      - name: Upload Credentials
        uses: actions/upload-artifact@v4
        with:
          name: gcp-credentials
          path: src/main/resources/credentials.json

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17.0.10'
          cache: 'maven'

      - name: Download GCP Credentials
        uses: actions/download-artifact@v4
        with:
          name: gcp-credentials
          path: src/main/resources/

      - name: Run tests
        run: mvn clean install -s /dev/null -Dspring.profiles.active=test --fail-at-end -X 2>&1 | tee build.log
